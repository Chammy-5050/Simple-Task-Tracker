# Render Blueprint for the Django API (Dashboard → New → Blueprint → this repo).
# Values marked `sync: false` are secrets: Render asks for them when the Blueprint
# is created, and they never live in git. Everything else is safe to commit.
services:
  - type: web
    name: stt-backend
    runtime: python
    plan: free
    rootDir: taskTracker
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Free instances have no pre-deploy step, so migrations run before the server starts.
    startCommand: >-
      python manage.py migrate --noinput &&
      python manage.py createcachetable &&
      gunicorn taskTracker.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      # Render's proxy adds one X-Forwarded-For hop; throttles use the client IP before it.
      - key: TRUSTED_PROXY_COUNT
        value: "1"

      # Render Postgres (below): connection details come from the database itself,
      # over Render's private network, so no password is copied by hand.
      - key: POSTGRES_HOST
        fromDatabase:
          name: stt-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: stt-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: stt-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: stt-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: stt-db
          property: password

      # Frontend on Vercel.
      - key: CORS_ALLOWED_ORIGINS
        value: https://simpletasktracker.vercel.app,https://stt-frontend-kenethpmussa.vercel.app
      - key: FRONTEND_URL
        value: https://simpletasktracker.vercel.app

      # Email through Brevo's API (Render's free tier blocks SMTP ports).
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

      # Profile pictures in Cloudflare R2 (Render's disk is wiped on every deploy).
      - key: S3_BUCKET_NAME
        value: stt-media
      - key: S3_ENDPOINT_URL
        value: https://0b5b39f0e39b86f4f63d44feb533788d.r2.cloudflarestorage.com
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

databases:
  # Must be in the same region as the web service for the private connection to work.
  - name: stt-db
    plan: free
    databaseName: smalltask
    user: tasktracker
    postgresMajorVersion: "17"
