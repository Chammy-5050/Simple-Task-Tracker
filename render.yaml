# Exported from Render on 2026-10-26T01:49:03Z
version: "1"
services:
- type: web
  name: stt-backend
  runtime: python
  repo: https://github.com/Chammy-5050/Simple-Task-Tracker
  plan: free
  envVars:
  - key: S3_ENDPOINT_URL
    sync: false
  - key: S3_BUCKET_NAME
    sync: false
  - key: FRONTEND_URL
    sync: false
  - key: CORS_ALLOWED_ORIGINS
    sync: false
  - key: POSTGRES_SSLMODE
    sync: false
  - key: POSTGRES_USER
    sync: false
  - key: POSTGRES_DB
    sync: false
  - key: POSTGRES_PORT
    sync: false
  - key: POSTGRES_HOST
    sync: false
  - key: TRUSTED_PROXY_COUNT
    sync: false
  - key: SECRET_KEY
    sync: false
  - key: DEBUG
    sync: false
  - key: PYTHON_VERSION
    sync: false
  region: oregon
  buildCommand: pip install -r requirements.txt && python manage.py collectstatic
    --noinput
  startCommand: python manage.py migrate --noinput && python manage.py createcachetable
    && gunicorn taskTracker.wsgi:application --bind 0.0.0.0:$PORT
  autoDeployTrigger: commit
  rootDir: taskTracker
