{% extends "notifications/email/base.html" %}
{% block content %}
<h1 style="margin:0 0 12px;font-size:22px;line-height:28px;color:#25212d;">Welcome to {{ app_name }}</h1>
<p style="margin:0 0 16px;font-size:15px;line-height:22px;">Hi {{ full_name|default:"there" }},<br>Your email is verified and your account is ready. Create a project, add tasks and keep every deadline in view.</p>
<p style="margin:0 0 16px;"><a href="{{ frontend_url }}/login" style="display:inline-block;padding:12px 24px;background:#4c1fa8;border-radius:8px;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;">Sign in to {{ app_name }}</a></p>
{% endblock %}
